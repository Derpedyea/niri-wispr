[package]
name = "dictationapp"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.18.2"
dirs = "7.0.0"
evdev = "0.13.2"
gpui = "0.2.2"
hound = "3.5.1"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
toml = "1.1.6"
tempfile = "3.27.0"
ureq = { version = "3.4.1", features = ["json"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.8.0"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
